<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects - TestBay Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-50">
    <!-- Demo Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center">
            <div class="flex-shrink-0">
              <a href="index.html" class="text-2xl font-bold text-blue-600"
                >TestBay</a
              >
            </div>
            <div class="ml-8 flex items-center space-x-4">
              <a
                href="demo-dashboard.html"
                class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
                >Dashboard</a
              >
              <a
                href="demo-projects.html"
                class="bg-blue-100 text-blue-700 px-3 py-2 rounded-md text-sm font-medium"
                >Projects</a
              >
              <a
                href="demo-runs.html"
                class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
                >Test Runs</a
              >
              <a
                href="demo-analytics.html"
                class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
                >Analytics</a
              >
              <a
                href="demo-settings.html"
                class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
                >Settings</a
              >
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <a
              href="demo.html"
              class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
              >← Back to Demo</a
            >
            <a
              href="index.html"
              class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
              >Home</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- Projects Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Page Header -->
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Projects</h1>
          <p class="mt-2 text-gray-600">
            Manage your test projects and configurations
          </p>
        </div>
        <button
          id="create-project-btn"
          class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors flex items-center"
        >
          <i data-lucide="plus" class="h-5 w-5 mr-2"></i>
          Create Project
        </button>
      </div>

      <!-- Projects Grid -->
      <div
        id="projects-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      >
        <!-- Projects will be populated here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center py-16">
        <i
          data-lucide="folder"
          class="h-24 w-24 text-gray-300 mx-auto mb-6"
        ></i>
        <h3 class="text-lg font-medium text-gray-900 mb-2">No projects yet</h3>
        <p class="text-gray-500 mb-6">
          Create your first project to start managing test results
        </p>
        <button
          id="empty-create-btn"
          class="bg-blue-600 text-white px-6 py-3 rounded-md hover:bg-blue-700 transition-colors"
        >
          Create Project
        </button>
      </div>
    </div>

    <!-- Create Project Modal -->
    <div
      id="create-project-modal"
      class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
    >
      <div
        class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white z-60"
        onclick="event.stopPropagation()"
      >
        <div class="mt-3">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-medium text-gray-900">
              Create New Project
            </h3>
            <button id="close-modal" class="text-gray-400 hover:text-gray-600">
              <i data-lucide="x" class="h-6 w-6"></i>
            </button>
          </div>

          <form id="create-project-form" class="space-y-4">
            <div>
              <label
                for="project-name"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Project Name</label
              >
              <input
                type="text"
                id="project-name"
                name="name"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Enter project name"
              />
            </div>

            <div>
              <label
                for="project-description"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Description</label
              >
              <textarea
                id="project-description"
                name="description"
                rows="3"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Enter project description"
              ></textarea>
            </div>

            <div>
              <label
                for="project-framework"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Test Framework</label
              >
              <select
                id="project-framework"
                name="framework"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              >
                <option value="">Select framework</option>
                <option value="cypress">Cypress</option>
                <option value="playwright">Playwright</option>
                <option value="jest">Jest</option>
                <option value="pytest">Pytest</option>
                <option value="junit">JUnit</option>
                <option value="selenium">Selenium</option>
                <option value="mocha">Mocha</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="flex justify-end space-x-3 pt-4">
              <button
                type="button"
                id="cancel-create"
                class="px-4 py-2 text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 transition-colors"
              >
                Cancel
              </button>
              <button
                type="submit"
                id="submit-create-project"
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors"
              >
                Create Project
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="js/utils.js"></script>
    <script src="js/demo-projects.js"></script>
  </body>
</html>
